site_name: Home Connect for Domoticz
site_description: >-
  A Domoticz plugin for Home Connect appliances (Bosch, Siemens, Neff, Gaggenau): state,
  programs, remaining time, alerts and washer meters, with opt-in control.
site_author: Rouzax
site_url: https://rouzax.github.io/home-connect-domoticz-plugin/
repo_url: https://github.com/Rouzax/home-connect-domoticz-plugin
repo_name: Rouzax/home-connect-domoticz-plugin
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Rouzax - not affiliated with BSH or Home Connect

# Built with Zensical, which reads this mkdocs.yml natively. Material for
# MkDocs went into maintenance mode in November 2025; Zensical is the same
# team's successor. Keeping the config in mkdocs.yml rather than the native
# zensical.toml is deliberate: it is what the Zensical project itself does,
# and it keeps the build tool swappable.
#
# Zensical has no `-d` / `--site-dir` flag, so this key is the only thing that
# decides where the build lands, and docs.yml publishes exactly this path.
site_dir: site

theme:
  name: material
  icon:
    logo: material/washing-machine
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  # Zensical's recommended set (as generated by `zensical new`), plus this
  # project's existing toc.follow. navigation.path (breadcrumbs) and
  # navigation.indexes (section index pages) are left out on purpose: the nav
  # below is nine flat top-level entries, so both would render nothing.
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

# Never publish the local-only planning docs. Only honoured by MkDocs;
# Zensical ignores exclude_docs, so .gitignore is the real guard, which keeps
# docs/superpowers/ out of the repo and therefore out of CI.
exclude_docs: |
  superpowers/

# Renders a small icon row in the footer of every page. Icon names resolve against
# the sets Zensical bundles under templates/.icons; an unknown name fails the
# build rather than rendering nothing.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rouzax/home-connect-domoticz-plugin
      name: Home Connect for Domoticz on GitHub
    - icon: simple/kofi
      link: https://ko-fi.com/O0W221GBUG
      name: Support Home Connect for Domoticz on Ko-fi

extra_css:
  - stylesheets/extra.css

# Zensical's recommended set, as generated by `zensical new`. Declaring this
# key at all suppresses those defaults, so the list is kept complete rather
# than trimmed to what today's pages happen to use.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  # Wraps images in a zoomable overlay. Bundled with Zensical, no CDN.
  - zensical.extensions.glightbox:
      auto_themed: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Rouzax
      repo: home-connect-domoticz-plugin
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Installation: install.md
  - Settings: settings.md
  - Devices: devices.md
  - Control: control.md
  - How it works: internals.md
  - Security: security.md
  - Troubleshooting: faq.md
  - About: about.md
