version: 2
updates:
  # GitHub Actions used by the CI and release workflows (pinned to SHAs).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Dev and docs tooling (requirements-dev.txt, requirements-docs.txt); the runtime is
  # stdlib-only.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
